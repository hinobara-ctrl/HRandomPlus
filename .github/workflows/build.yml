name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HRandomPlus.sln
      - run: dotnet build HRandomPlus.sln -c Release --no-restore
      - run: dotnet run --project tests/HRandomPlus.Tests/HRandomPlus.Tests.csproj -c Release --no-build

  windows-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/HRandomPlus.Desktop/HRandomPlus.Desktop.csproj -r win-x64 -p:TargetFramework=net8.0-windows
      - run: dotnet publish src/HRandomPlus.Desktop/HRandomPlus.Desktop.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows-x64 --no-restore
      - shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/HRandomPlus-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HRandomPlus-windows-x64
          path: artifacts/HRandomPlus-windows-x64.zip

  linux-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/HRandomPlus.Desktop/HRandomPlus.Desktop.csproj -r linux-x64 -p:TargetFramework=net8.0
      - run: dotnet restore src/HRandomPlus.Cli/HRandomPlus.Cli.csproj -r linux-x64
      - run: dotnet publish src/HRandomPlus.Desktop/HRandomPlus.Desktop.csproj -c Release -f net8.0 -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/linux-x64 --no-restore
      - run: dotnet publish src/HRandomPlus.Cli/HRandomPlus.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/linux-x64-cli --no-restore
      - run: cd artifacts/linux-x64 && zip -r ../HRandomPlus-linux-x64.zip .
      - run: cd artifacts/linux-x64-cli && zip -r ../HRandomPlus-linux-x64-cli.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: HRandomPlus-linux-x64
          path: artifacts/HRandomPlus-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HRandomPlus-linux-x64-cli
          path: artifacts/HRandomPlus-linux-x64-cli.zip
